controller_manager:
  ros__parameters:
    update_rate: 1000
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    upper_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    lower_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    chassis_controller:
      type: forward_command_controller/ForwardCommandController

    blastdog_casing_controller:
      type: joint_trajectory_controller/JointTrajectoryController

upper_arm_controller:
  ros__parameters:
    joints:
      - upper_arm_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

lower_arm_controller:
  ros__parameters:
    joints:
      - lower_arm_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5

chassis_controller:
  ros__parameters:
    joints:
      - chassis_joint
    interface_name: velocity

blastdog_casing_controller:
  ros__parameters:
    joints:
      - casing_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.25

